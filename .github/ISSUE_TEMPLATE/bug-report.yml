name: Bug report
description: Something is broken, like a crash, an error, controls that stop responding or a wrong score.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If it works but doesn't *feel* right, use a **Feel report** instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      placeholder: |
        1. Start the Spike Drill as the Middle Blocker, first person
        2. Press B twice (double block)
        3. Press R after the spike
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: drill
    attributes:
      label: Drill
      options:
        - Free Play
        - Spike Drill
        - Block Drill
        - Serve Receive / Dig
        - Setter Drill
        - Mini Rally
        - Start screen or settings
  - type: input
    id: setup
    attributes:
      label: Position and camera
      placeholder: "Middle Blocker, first person"
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "MacBook Air, Chrome 142 / iPhone 15, Safari"
    validations:
      required: true
  - type: dropdown
    id: often
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Once
  - type: textarea
    id: console
    attributes:
      label: Console errors (optional)
      description: On a computer, press F12 and open the Console tab. Paste anything in red.
      render: text
  - type: textarea
    id: media
    attributes:
      label: Screenshots or a clip (optional)
